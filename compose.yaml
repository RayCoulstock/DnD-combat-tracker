services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ledger
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ledger_dev_only}
      POSTGRES_DB: ledger
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - ledger-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ledger -d ledger"]
      interval: 2s
      timeout: 3s
      retries: 30
  app:
    profiles: ["app"]
    build: .
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://ledger:${POSTGRES_PASSWORD:-ledger_dev_only}@postgres:5432/ledger
      SESSION_SECRET: ${SESSION_SECRET:-}
      APP_ORIGIN: ${APP_ORIGIN:-https://localhost}
      ASSET_STORAGE_DIR: /var/lib/encounter-ledger/assets
      FLOOR_IMAGE_MAX_BYTES: ${FLOOR_IMAGE_MAX_BYTES:-15728640}
      FLOOR_IMAGE_MAX_DIMENSION: ${FLOOR_IMAGE_MAX_DIMENSION:-8192}
      FLOOR_IMAGE_MAX_PIXELS: ${FLOOR_IMAGE_MAX_PIXELS:-33554432}
      FLOOR_IMAGE_TEXTURE_DIMENSION: ${FLOOR_IMAGE_TEXTURE_DIMENSION:-4096}
      FLOOR_IMAGE_TIMEOUT_MS: ${FLOOR_IMAGE_TIMEOUT_MS:-20000}
    ports:
      - "127.0.0.1:3001:3001"
    volumes:
      - ledger-assets:/var/lib/encounter-ledger/assets
    depends_on:
      postgres:
        condition: service_healthy
volumes:
  ledger-assets:
  ledger-data:
